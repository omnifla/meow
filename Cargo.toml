[package]
name = "meow"
version = "0.1.0"
edition = "2021"
description = "Declarative, reactive UI framework for editors, apps and in-game UI"
license = "MIT"
repository = "https://github.com/omnifla/meow"

[features]
default = []
wgpu = ["dep:wgpu"]
winit = ["dep:winit"]
desktop = ["wgpu", "winit", "dep:pollster", "dep:arboard"]
a11y = []

[dependencies]
taffy = "0.10"
cosmic-text = "0.16"
wgpu = { version = "30", optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
arboard = { version = "3", default-features = false, optional = true }

[[example]]
name = "hello_window"
required-features = ["desktop"]